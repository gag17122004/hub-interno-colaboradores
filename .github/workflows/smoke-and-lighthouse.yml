name: Smoke Tests + Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests (produção)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar smoke tests contra produção
        run: node tests/smoke.test.mjs https://hub-interno-colaboradores.web.app

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Rodar Lighthouse
        run: |
          lhci autorun \
            --collect.url=https://hub-interno-colaboradores.web.app \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=error \
            --assert.assertions.categories:best-practices=warn \
            --assert.assertions.categories:seo=off \
            --upload.target=temporary-public-storage
        continue-on-error: true
