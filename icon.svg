<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <!-- Borda teal sutil -->
  <rect x="20" y="20" width="472" height="472" rx="68" fill="none" stroke="#2dd4bf" stroke-width="6" opacity="0.35"/>
  <!-- Letra P centralizada -->
  <text x="256" y="345"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="308"
    font-weight="900"
    fill="#2dd4bf"
    text-anchor="middle">P</text>
  <!-- Nome da empresa -->
  <text x="256" y="446"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="600"
    fill="#64748b"
    text-anchor="middle"
    letter-spacing="10">PRATIK</text>
</svg>
